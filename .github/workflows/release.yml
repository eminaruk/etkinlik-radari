# Pushing a version tag (git tag v1.1.0 && git push origin v1.1.0) builds the Windows setup wizard
# and attaches it to a GitHub Release. It can also be started by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest
      - name: Test
        run: python -m pytest -q
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: python packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: EtkinlikRadari-Setup
          path: dist/*-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-Setup.exe
          generate_release_notes: true
